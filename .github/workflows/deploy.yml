name: Validate Club Privé

on:
  push:
    branches: ['main', 'feat/club-privee-cloudflare']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 'check-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Test business rules and API
        run: npm test
      - name: Build
        run: npm run build
